services:
  backend:
    image: appxcess/selfawareness-backend:latest
    container_name: meditation_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meditation
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --requirepass "hOW32#$@41u31Aq4"
    ports:
      - "6379:6379"

volumes:
  postgres_data: